
name: Sync WordPress Videos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-wordpress-videos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests Pillow

      
      - name: Sync videos
        run: |
          echo "DIAG 1: Shell started"
          pwd
          ls -l scripts/sync_videos.py
          head -n 3 scripts/sync_videos.py
          python -u -c "print('DIAG 2: Python started', flush=True)"
          set +e
          timeout 30s python -u scripts/sync_videos.py
          status=$?
          echo "DIAG 3: Script exit code = $status"
          exit "$status"
          

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/videos.json assets/thumb
            git commit -m "Sync WordPress videos"
            git push
          else
            echo "No changes to commit"
          fi
